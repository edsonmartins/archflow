name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: '**/target/*.jar'
          retention-days: 1

  maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    # Sem `needs`: a biblioteca e a imagem Docker são produtos independentes, e
    # uma falha no frontend não deve impedir a publicação (nem o contrário).
    # Este job roda a suíte inteira por conta própria — ver o passo de build.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set POM version from tag
        run: mvn -B versions:set -DnewVersion="${{ steps.version.outputs.VERSION }}" -DgenerateBackupPoms=false

      # Com testes, de propósito. Publicar no Central é IRREVERSÍVEL — o portal
      # não aceita remover uma versão já publicada, só publicar outra por cima.
      # O job build-backend usa -DskipTests porque uma imagem Docker se
      # sobrescreve; aqui isso não vale.
      - name: Build and test
        run: mvn -B clean install

      # A chave privada entra num GNUPGHOME descartável, e o pinentry em modo
      # loopback porque não há terminal para digitar a passphrase.
      - name: Import GPG key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 --decode | gpg --batch --import
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
          gpgconf --reload gpg-agent || true

      # -pl restringe o reator aos três artefatos publicados. É a segunda
      # barreira: a primeira é archflow.publish.skip=true no pom raiz, que só os
      # três viram para false. Se uma falhar, a outra ainda impede que um módulo
      # vá parar no Central por engano.
      #
      # -DskipTests aqui porque o passo anterior já os rodou; sem `clean`, para
      # reaproveitar o que ele compilou.
      - name: Deploy to Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B deploy -Pmaven-central -DskipTests \
            -pl archflow-model,archflow-dsl,archflow-sdk-java \
            -s .maven-settings.xml.template

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archflow-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: archflow-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: archflow-ui/dist/
          retention-days: 1

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: artifacts/backend

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: artifacts/backend

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/frontend

      - name: Package frontend dist
        run: tar -czf archflow-ui-dist.tar.gz -C artifacts/frontend .

      - name: Find API jar
        id: api-jar
        run: |
          JAR=$(find artifacts/backend -name "archflow-api-*.jar" -not -name "*-sources*" -not -name "*-javadoc*" | head -1)
          echo "PATH=${JAR}" >> $GITHUB_OUTPUT

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Archflow v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            ${{ steps.api-jar.outputs.PATH }}
            archflow-ui-dist.tar.gz
