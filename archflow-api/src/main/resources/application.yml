spring:
  application:
    name: archflow-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Flyway aplica classpath:db/migration no boot quando há um DataSource (prod).
  # Em dev in-memory não há DataSource, então a auto-config se desliga sozinha.
  # Defaults do Spring Boot: migra um schema vazio do zero; recusa um schema
  # não-vazio sem histórico (o operador decide via `flyway baseline`).
  jackson:
    default-property-inclusion: non_null
    # Frontend expects ISO8601 strings for java.time.Instant (e.g.
    # "2026-04-27T10:00:00Z"). Jackson 3 (Spring Boot 4) serializes
    # java.time as ISO-8601 strings by default, so the old
    # write-dates-as-timestamps flag is no longer needed (and its enum
    # was removed in Jackson 3).
  servlet:
    multipart:
      # Alinhado ao limite do FileStorageService. Sem isto, o default de 1 MB
      # do Spring rejeita PDFs/DOCX antes de chegarem ao endpoint.
      max-file-size: ${ARCHFLOW_STORAGE_MAX_FILE_SIZE:25MB}
      max-request-size: ${ARCHFLOW_STORAGE_MAX_REQUEST_SIZE:26MB}

server:
  port: ${SERVER_PORT:16080}
  error:
    include-message: always
    include-stacktrace: never

# archflow-specific configuration
archflow:
  security:
    jwt:
      secret: ${ARCHFLOW_JWT_SECRET:change-me-in-production-this-must-be-very-long-at-least-256-bits}
      access-token-expiration-seconds: ${ARCHFLOW_JWT_TTL:900}
  cors:
    allowed-origins: ${ARCHFLOW_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
  # Família de endpoints síncronos de assistência por IA (/archflow/assist/*, ADR-0004).
  # Se api-key estiver definida, o controller exige o header X-ArchFlow-Key; vazio = libera (dev).
  assist:
    api-key: ${ARCHFLOW_ASSIST_API_KEY:}
  # Servidores MCP conhecidos por esta instalação. Um nó 'mcp-agent' escolhe qual usar por
  # REFERÊNCIA (server: "vendax"); endereço e credencial ficam fora do documento do fluxo, que é
  # versionado e visível no designer — e é o que permite o mesmo fluxo rodar aqui e num agente local.
  # Vazio = sem MCP: fluxos com o nó falham na execução, com log de aviso na subida.
  mcp:
    # servers:
    #   vendax:
    #     base-url: ${ARCHFLOW_VENDAX_MCP_URL:}
    #     service-token: ${ARCHFLOW_VENDAX_MCP_TOKEN:}
    # Usado quando o nó não declara 'server'. Com um único servidor, ele já é o default.
    default-server: ${ARCHFLOW_MCP_DEFAULT_SERVER:}
  # VendaX Core como MCP server HTTP (POST /mcp). O agente QP consome as tools do
  # Core (resolver_sku, simular/firmar/enviar_cotacao, sugerir_itens, ...). O
  # HttpMcpClient envia Authorization: Bearer <service-token> + X-TENANT-ID a cada
  # chamada. Vazio = integração desligada (POST /api/agents/qp/quote responde 503).
  vendax:
    mcp:
      base-url: ${ARCHFLOW_VENDAX_MCP_URL:}
      service-token: ${ARCHFLOW_VENDAX_MCP_TOKEN:}
    # Caminho de volta: o Core aciona o agente em POST /api/agents/invoke e o resultado é devolvido
    # ao Core, assinado (HMAC-SHA256 sobre timestamp + "." + body). Vazio = o resultado é descartado
    # com aviso, e a cotação que o agente acabou de produzir não chega ao vendedor.
    core:
      base-url: ${ARCHFLOW_VENDAX_CORE_URL:}
      result-secret: ${ARCHFLOW_VENDAX_RESULT_SECRET:}
    # Chave que o Core apresenta em POST /api/agents/invoke. Vazio = endpoint recusa tudo (503):
    # ele fica fora do filtro JWT, então abrir por omissão deixaria qualquer um mandando o agente
    # rodar (e gastando LLM).
    invoke-key: ${ARCHFLOW_VENDAX_INVOKE_KEY:}
    agent:
      # Virtual threads isolam o I/O; os limites impedem crescimento invisível sob rajadas.
      max-concurrency: ${ARCHFLOW_VENDAX_AGENT_MAX_CONCURRENCY:32}
      queue-capacity: ${ARCHFLOW_VENDAX_AGENT_QUEUE_CAPACITY:256}

logging:
  level:
    br.com.archflow: DEBUG
    org.springframework.web: INFO
