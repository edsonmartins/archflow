# Production configuration for archflow
# Activate with: SPRING_PROFILES_ACTIVE=prod

server:
  port: ${SERVER_PORT:16080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  flyway:
    # As migrações são numeradas POR MÓDULO (V1_x core, V2_x conversation, V3_x memória,
    # V4_x observabilidade, V5_x segurança, V6_x api), não em ordem cronológica global. Uma
    # migração nova num módulo de prefixo baixo — como a V1_3 do core — chega depois de V6_x já
    # aplicadas, e o Flyway a recusa como "resolved migration not applied", derrubando o boot.
    # Sem isto, evoluir o core exigiria renumerar a migração para o fim da fila global.
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:true}

# Spring Boot Actuator - Production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: archflow
      environment: ${SPRING_PROFILES_ACTIVE:prod}
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# archflow observability
archflow:
  # Produção usa persistência durável (JDBC/PostgreSQL) por padrão. Liga o
  # JdbcPersistenceConfiguration e desliga os defaults em memória — o
  # ProductionReadinessGuard já recusaria o boot com stores in-memory fora de
  # dev/test, então este default alinha o perfil ao que o guard exige. Requer
  # spring.datasource.* (acima). Override: ARCHFLOW_PERSISTENCE_JDBC_ENABLED=false.
  persistence:
    jdbc:
      enabled: ${ARCHFLOW_PERSISTENCE_JDBC_ENABLED:true}
  observability:
    metrics:
      enabled: true
    tracing:
      enabled: true
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  security:
    jwt:
      secret: ${ARCHFLOW_JWT_SECRET}
      expiration: 3600
    # Production MUST reject unauthenticated requests on protected paths.
    auth:
      enabled: true
  admin:
    # Production must NOT seed demo data or accept impersonation headers.
    seedDemoData: false
    tenantFallback: ""
    impersonation:
      enabled: false
